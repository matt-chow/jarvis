[package]
name = "directory-core"
description = "Portable Directory domain logic. Must not depend on Cloudflare APIs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Crypto for WebAuthn verification. Default features off: no `getrandom`
# (randomness is injected via the `Entropy` trait) and smaller WASM.
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8"] }
rsa = { version = "0.9.10", default-features = false }
sha2 = { version = "0.10.9", default-features = false, features = ["oid"] }

[dev-dependencies]
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
rsa = { version = "0.9.10", default-features = false, features = ["pem"] }
