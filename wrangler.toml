# Directory — single Worker serving the PWA (static assets) and the Rust API.
# Free-tier only: Workers Free, D1 free, R2 free (10 GB). No paid features.
# See ARCHITECTURE.md › Deployment for one-time Cloudflare setup.

name = "directory"
main = "crates/directory-worker/build/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# Do not attach preview URLs that would expose the app on extra hostnames.
preview_urls = false

[build]
command = "worker-build --release"
cwd = "crates/directory-worker"
watch_dir = ["crates/directory-core/src", "crates/directory-worker/src"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only API routes invoke the Worker; static files are served directly (free, unmetered).
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "directory-db"
# Replace with the id printed by `npx wrangler d1 create directory-db`.
# Local development (`--local`) works with this placeholder.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
# Private bucket: never enable r2.dev public access or a custom domain on it.
bucket_name = "directory-files"

[vars]
# Passkey relying party. Must be set to the deployed hostname before deploy, e.g.
#   DIRECTORY_RP_ID = "directory.<subdomain>.workers.dev"
#   DIRECTORY_ORIGINS = "https://directory.<subdomain>.workers.dev"
# Left empty, sign-in fails closed (503 auth_not_configured). .dev.vars overrides locally.
DIRECTORY_RP_ID = ""
DIRECTORY_ORIGINS = ""

# Secrets (not stored here):
#   DIRECTORY_SETUP_TOKEN — `npx wrangler secret put DIRECTORY_SETUP_TOKEN`; locally via .dev.vars
#   OPENROUTER_API_KEY    — optional, AI intent parsing (D-043, docs/JARVIS_SHORTCUTS.md).
# Optional AI vars (AI stays off unless both the key and a ":free" model are set):
#   JARVIS_AI_MODEL = "<openrouter model id ending in :free>"
#   JARVIS_AI_DAILY = "40"   # most AI calls per owner per UTC day

# ---------------------------------------------------------------------------
# Staging (docs/STAGING.md): a separate Worker, D1 database, and private R2
# bucket, so tests never touch production data. Deploy with
#   npm run deploy:staging
# Bindings and vars are not inherited from the top level; repeat them here.
[env.staging]
name = "directory-staging"
workers_dev = true
preview_urls = false

[[env.staging.d1_databases]]
binding = "DB"
database_name = "directory-db-staging"
# Replace with the id printed by `npx wrangler d1 create directory-db-staging`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "FILES"
# Private bucket: never enable r2.dev public access or a custom domain on it.
bucket_name = "directory-files-staging"

[env.staging.vars]
# Set to the staging hostname before deploying, e.g.
#   DIRECTORY_RP_ID = "directory-staging.<subdomain>.workers.dev"
#   DIRECTORY_ORIGINS = "https://directory-staging.<subdomain>.workers.dev"
# Left empty, sign-in fails closed (503 auth_not_configured).
DIRECTORY_RP_ID = ""
DIRECTORY_ORIGINS = ""
