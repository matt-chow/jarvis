[workspace]
resolver = "2"
members = ["crates/directory-core", "crates/directory-worker"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Workers Free caps the compressed Worker at 3 MB; keep the WASM small.
opt-level = "z"
lto = true
codegen-units = 1
# Do not set `strip = true`: it removes the wasm `target_features` section that
# wasm-bindgen needs to detect reference-types ("externref table required").
